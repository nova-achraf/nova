  { id:'noor', name:'NOOR', role:'SNIPER',  hp:90,  spd:1.05, dmg:1.35, rate:1.3,

    look:{skin:0xd9b08c, hair:0x241a12, style:'pony', female:true, accent:0xa04ac8, iris:0x2e6ea8, acc:'shades', shirt:0x2e6e6a, pants:0x2b3038, vest:0x23282e, boots:0x30282e, pack:0x37424a} },
  { id:'volt', name:'VOLT', role:'ENGINEER',hp:100, spd:1.12, dmg:0.95, rate:0.95,

    look:{skin:0x8a5a34, hair:0x141414, style:'buzz', hat:'hardhat', accent:0xf0b020, iris:0x2a3a2a, shirt:0xb05a20, pants:0x3a3228, vest:0x2e2e30, boots:0x2a2420, pack:0x44403a} },
  { id:'rez',  name:'REZ',  role:'SCOUT',    hp:85,  spd:1.2,  dmg:0.9,  rate:0.85,

    look:{skin:0xb98a5f, hair:0x2c1c10, style:'bandana', band:0xa03020, accent:0xa03020, iris:0x3a5a2a, acc:'scarf', shirt:0x8a7448, pants:0x4a4436, vest:0x35302a, boots:0x2c2a26, pack:0x3c3630} }
];

// ---------------- STATE ----------------
var state = {
  started:false, over:false, charId: localStorage.getItem('az_char') || 'azr',
  hp:100, hpMax:100, ammo:CFG.magSize, reloading:false, reloadT:0,

  shootHeld:false, shootCd:0, lastHitT:-99,

  yaw:Math.PI, pitch:0.32, walkT:0,
  sirenT:14, zone:''
};
function CHAR(){ for (var i=0;i<CHARS.length;i++) if (CHARS[i].id===state.charId) return CHARS[i]; return CHARS[0]; }
var zombies = [];
var obstacles = [], blockers = [], zHitParts = [];
var lightbars = [];   // emergency vehicle lights
var warFires = [], warSmokes = [];  // war-zone fires & smoke plumes
var boomT = 30;                   // distant battle booms timer
var keys = {};

// ---------------- AUDIO (weapons + human voices + sirens) ----------------
var actx = null, master = null;
function initAudio(){
  if (actx) return;
  try{
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
  }catch(e){ actx = null; }
}
function env(g, t0, a, d, peak){ g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(peak, t0+a); g.gain.exponentialRampToValueAtTime(0.0001, t0+a+d); }
function tone(type, f0, f1, dur, peak, delay){ if(!actx)return; var t=actx.currentTime+(delay||0), o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  env(g,t,0.01,dur,peak); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.1); }
// weapon sounds — gun: 0 light SMG, 1 assault, 2 heavy sniper
function sShoot(gun){ if(!actx)return; var t=actx.currentTime, n=actx.createBufferSource(), len=2048, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  n.buffer=buf; var f=actx.createBiquadFilter(); f.type='lowpass';
  f.frequency.value = gun===2 ? 1400 : (gun===0 ? 2400 : 1900);
  var g=actx.createGain(); env(g,t,0.004, gun===2 ? 0.22 : 0.1, gun===2 ? 0.5 : 0.32);
  n.connect(f); f.connect(g); g.connect(master); n.start(t);
  if (gun===2) tone('square',110,50,0.18,0.14); }
function sHit(){ tone('square',130,60,0.09,0.22); }
function sGrowl(){ tone('sawtooth',55+Math.random()*30,40,0.5,0.14); }
function sZScream(){ tone('sawtooth',320,80,0.45,0.2); }
function sZDie(){ tone('sawtooth',150,35,0.55,0.2); }
// human character voice — grunt with per-character pitch
function sGrunt(p){ tone('sawtooth',115*p,62*p,0.16,0.24); tone('square',75*p,50*p,0.2,0.12,0.02); }
function sHurt(){ tone('sine',95,50,0.18,0.3); }
function sReload(){ tone('square',900,0,0.03,0.15); tone('square',1300,0,0.03,0.15,0.14); }
function sWave(){ tone('square',330,0,0.16,0.2); tone('square',440,0,0.2,0.2,0.18); }
function sEmpty(){ tone('square',1500,0,0.04,0.1); }
// distant emergency siren (ambulance/police atmosphere)
function sSiren(kind){ if(!actx)return;
  var base = kind==='amb' ? 660 : 720;
  tone('sine',base,base+240,0.7,0.05);
  tone('sine',base+240,base,0.7,0.05,0.7);
  tone('sine',base,base+240,0.7,0.05,1.4); }
// distant battle boom (war-zone atmosphere)
function sBoom(){ if(!actx)return;
  tone('sine',70,26,0.9,0.22);
  var t=actx.currentTime, n=actx.createBufferSource(), len=4096, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  n.buffer=buf; var f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300;
  var g=actx.createGain(); env(g,t,0.01,0.8,0.18);
  n.connect(f); f.connect(g); g.connect(master); n.start(t); }
// character voice lines via speech synthesis (fallback-safe)
function say(txt){
  try{
    if (!window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = 'en-US'; u.volume = 0.85; u.rate = 1.05;
    var v = state.charId === 'noor' ? 1.4 : (state.charId === 'volt' ? 0.8 : 1.0);
    u.pitch = v;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

// ---------------- THREE SETUP + WORLD ----------------
var renderer, scene, camera, clock, dustGeo;
var player = { g:null, refs:{} };
var muzzleFlash, tracerPool = [], partPool = [];
var V0, V1, V2, raycaster;

function makeSign(txt, color){
  var c = document.createElement('canvas'); c.width = 256; c.height = 128;

  x.fillStyle = '#1c150e'; x.fillRect(0,0,256,128);

}
function emergencyVehicle(kind, x, z, rot){
  // original AZANOVA emergency vehicle (abandoned after THE FALL)
  var g = new THREE.Group();
  var isAmb = kind === 'amb';
  var bodyMat = new THREE.MeshLambertMaterial({ color: isAmb ? 0xe8e4dc : 0xe0e2e4 });

function buildWorld(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xd9a15e);
  scene.fog = new THREE.Fog(0xd9a15e, 14, 95);
  renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.insertBefore(renderer.domElement, document.body.firstChild);
  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 300);
  clock = new THREE.Clock();
  V0 = new THREE.Vector3(); V1 = new THREE.Vector3(); V2 = new THREE.Vector3();
  raycaster = new THREE.Raycaster();

  scene.add(new THREE.HemisphereLight(0xe8b878, 0x4a3b28, 0.95));
  var sun = new THREE.DirectionalLight(0xffd9a0, 1.0); sun.position.set(35, 45, 18); scene.add(sun);

  // ground
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(220,220), new THREE.MeshLambertMaterial({ color:0x9c7a4f }));
  ground.rotation.x = -Math.PI/2; scene.add(ground); blockers.push(ground);
  var patchMat = new THREE.MeshLambertMaterial({ color:0x7a5c38 });
  for (var i=0;i<14;i++){ var p = new THREE.Mesh(new THREE.CircleGeometry(3+Math.random()*6, 8), patchMat);
    p.rotation.x = -Math.PI/2; p.position.set((Math.random()-0.5)*170, 0.02, (Math.random()-0.5)*170); scene.add(p); }
  // roads
  var roadMat = new THREE.MeshLambertMaterial({ color:0x3a3a3c });
  var r1 = new THREE.Mesh(new THREE.PlaneGeometry(200, 9), roadMat); r1.rotation.x = -Math.PI/2; r1.position.y = 0.03; scene.add(r1);
  var r2 = r1.clone(); r2.rotation.z = Math.PI/2; scene.add(r2);
  var dashMat = new THREE.MeshLambertMaterial({ color:0xd8d0b8 });
  for (var dpos=-95; dpos<=95; dpos+=8){
    var da = new THREE.Mesh(new THREE.PlaneGeometry(2.4,0.35), dashMat); da.rotation.x=-Math.PI/2; da.position.set(dpos,0.045,0); scene.add(da);
    var db = new THREE.Mesh(new THREE.PlaneGeometry(0.35,2.4), dashMat); db.rotation.x=-Math.PI/2; db.position.set(0,0.045,dpos); scene.add(db);
  }
  // ruined buildings (abandoned city + suburbs)
  var bPal = [0x5a5148, 0x2e8a8a, 0xb8503a, 0x4c4a45, 0x8a3a5a, 0x574f41, 0x3a342c];
  var winDark = new THREE.MeshLambertMaterial({ color:0x141420 });
  var winLit  = new THREE.MeshLambertMaterial({ color:0xffa040, emissive:0x662800 });
  var spots = [];
  for (var gx=-84; gx<=84; gx+=14) for (var gz=-84; gz<=84; gz+=14){
    if (Math.abs(gx)<12 || Math.abs(gz)<12) continue;
    if (Math.abs(gx)<22 && Math.abs(gz)<22) continue;
    if (gx < -35 && gz < -35) continue; // forest zone — no buildings
    if (gx < -35 && gz > 35) continue;  // green resort — no buildings
    spots.push([gx + (Math.random()-0.5)*6, gz + (Math.random()-0.5)*6]);
  }
  for (var s=0; s<spots.length; s++){
    var bx = spots[s][0], bz = spots[s][1];
    var w = 4+Math.random()*3, h = 4+Math.random()*6, dd = 4+Math.random()*3;
    var mat = new THREE.MeshLambertMaterial({ color: bPal[Math.floor(Math.random()*bPal.length)] });
    var b = new THREE.Mesh(new THREE.BoxGeometry(w,h,dd), mat);
    b.position.set(bx, h/2, bz); scene.add(b); blockers.push(b);
    obstacles.push({ x1:bx-w/2, z1:bz-dd/2, x2:bx+w/2, z2:bz+dd/2 });
    if (Math.random()<0.6){
      var t = new THREE.Mesh(new THREE.BoxGeometry(w*0.6, 1.2+Math.random()*1.5, dd*0.6), mat);
      t.position.set(bx+(Math.random()-0.5)*w*0.5, h+0.6, bz+(Math.random()-0.5)*dd*0.5);
      t.rotation.y = (Math.random()-0.5)*0.5; scene.add(t); blockers.push(t);
    }
    var nw = 2+Math.floor(Math.random()*3);
    for (var wi=0; wi<nw; wi++){
      var wm = Math.random()<0.12 ? winLit : winDark;
      var win = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.9), wm);
      var side = Math.floor(Math.random()*4);
      if (side===0) { win.position.set(bx, 1.5+Math.random()*(h-2), bz+dd/2+0.03); }
      else if (side===1) { win.position.set(bx, 1.5+Math.random()*(h-2), bz-dd/2-0.03); win.rotation.y = Math.PI; }
      else if (side===2) { win.position.set(bx+w/2+0.03, 1.5+Math.random()*(h-2), bz); win.rotation.y = Math.PI/2; }
      else { win.position.set(bx-w/2-0.03, 1.5+Math.random()*(h-2), bz); win.rotation.y = -Math.PI/2; }
      scene.add(win);
    }
  }
  // wrecked civilian cars
  var cPal = [0x33363a, 0x4a3030, 0x2f3a2f, 0x56504a];
  for (var c=0;c<9;c++){
    var cx = (Math.random()<0.5 ? (Math.random()-0.5)*10 : (Math.random()-0.5)*160);
    var cz = (Math.random()<0.5 ? (Math.random()-0.5)*160 : (Math.random()-0.5)*10);
    if (Math.abs(cx)<24 && Math.abs(cz)<24){ cx += 30; }
    if (cx<-40 && cz<-40){ cx = 30; }
    var cg = new THREE.Group();
    var body = new THREE.Mesh(new THREE.BoxGeometry(1.9,0.55,0.95), new THREE.MeshLambertMaterial({ color:cPal[Math.floor(Math.random()*cPal.length)] }));
    body.position.y = 0.35; cg.add(body);
    var cab = new THREE.Mesh(new THREE.BoxGeometry(1.0,0.5,0.85), new THREE.MeshLambertMaterial({ color:0x1c1e22 }));
    cab.position.set(-0.2,0.85,0); cg.add(cab);
    cg.position.set(cx, 0, cz); cg.rotation.y = Math.random()*Math.PI*2; cg.rotation.z = (Math.random()-0.5)*0.14;
    scene.add(cg); blockers.push(body);
  }
  // emergency vehicles (abandoned police + ambulance, lights still blinking)
  emergencyVehicle('pol', 6.5, -14, 1.1);
  emergencyVehicle('pol', -40, 8, 2.4);
  emergencyVehicle('amb', 16, 5.5, 0.3);
  emergencyVehicle('amb', -6.5, 42, -0.9);
  // concrete barriers + rocks (difficult terrain)
  var barMat = new THREE.MeshLambertMaterial({ color:0x8a8070 });
  for (var q=0;q<12;q++){
    var bar = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.8,0.5), barMat);
    var qx = (Math.random()-0.5)*9, qz = (Math.random()-0.5)*160;
    if (Math.random()<0.5){ var tmp=qx; qx=qz; qz=tmp; }
    if (Math.abs(qx)<20 && Math.abs(qz)<20) qz += 26;
    bar.position.set(qx, 0.4, qz); bar.rotation.y = (Math.random()-0.5)*0.6;
    scene.add(bar); blockers.push(bar);
  }
  var rockMat = new THREE.MeshLambertMaterial({ color:0x7a7268 });
  for (var rk=0; rk<10; rk++){
    var rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.5+Math.random()*0.8, 0), rockMat);
    var rx = (Math.random()-0.5)*160, rz = (Math.random()-0.5)*160;
    if (Math.abs(rx)<16 && Math.abs(rz)<16){ rx += 34; }
    rock.position.set(rx, 0.35, rz); rock.rotation.set(Math.random(),Math.random(),Math.random());
    scene.add(rock); blockers.push(rock);
  }
  // dead trees (ruins) + OLD FOREST zone (NW corner)
  var trunkMat = new THREE.MeshLambertMaterial({ color:0x4a382a });
  for (var tr=0;tr<8;tr++){
    var tx0 = (Math.random()-0.5)*160, tz0 = (Math.random()-0.5)*160;
    if (Math.abs(tx0)<14 && Math.abs(tz0)<14) tx0 += 24;
    if (tx0<-35 && tz0<-35) continue;
    var tg = new THREE.Group();
    var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.22,3.4,6), trunkMat); trunk.position.y = 1.7; tg.add(trunk);
    var br1 = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.1,0.1), trunkMat); br1.position.set(0.5,2.6,0); br1.rotation.z = -0.5; tg.add(br1);
    var br2 = new THREE.Mesh(new THREE.BoxGeometry(1.2,0.1,0.1), trunkMat); br2.position.set(-0.45,2.9,0.2); br2.rotation.z = 0.6; tg.add(br2);
    tg.position.set(tx0, 0, tz0); tg.rotation.y = Math.random()*Math.PI; scene.add(tg); blockers.push(trunk);
  }
  for (var pt=0; pt<14; pt++){
    var px2 = -40 - Math.random()*40, pz2 = -40 - Math.random()*40;
    if (Math.abs(px2) > CFG.bound-4 || Math.abs(pz2) > CFG.bound-4){ px2 = Math.max(-CFG.bound+4, px2); pz2 = Math.max(-CFG.bound+4, pz2); }
    pineTree(px2, pz2, 0.8+Math.random()*0.8);
  }
  // signs
  var s1 = new THREE.Mesh(new THREE.PlaneGeometry(4.4,2.2), makeSign('AZANOVA', '#e8862e'));
  s1.position.set(-9, 3.1, -12); s1.rotation.y = 0.5; scene.add(s1); blockers.push(s1);
  var s2 = new THREE.Mesh(new THREE.PlaneGeometry(4.4,2.2), makeSign('AREA 7', '#c22e18'));
  s2.position.set(11, 2.9, 13); s2.rotation.y = -2.2; scene.add(s2); blockers.push(s2);
  // ---- AZAMILUX billboards (sponsor advertising across the city) ----
  var bbMat = makeBrandMat();
  var bbSpots = [[-14,12,2.3],[16,-14,-0.85],[34,6,-1.74]];
  for (var bb=0; bb<bbSpots.length; bb++){
    var bpost = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.16,3.4,7), new THREE.MeshLambertMaterial({ color:0x2e2a24 }));
    bpost.position.set(bbSpots[bb][0], 1.7, bbSpots[bb][1]); scene.add(bpost); blockers.push(bpost);
    var bboard = new THREE.Mesh(new THREE.PlaneGeometry(3.2,3.2), bbMat);
    bboard.position.set(bbSpots[bb][0], 4.7, bbSpots[bb][1]); bboard.rotation.y = bbSpots[bb][2];
    scene.add(bboard); blockers.push(bboard);
    var bback = new THREE.Mesh(new THREE.PlaneGeometry(3.2,3.2), bbMat);
    bback.position.set(bbSpots[bb][0], 4.7, bbSpots[bb][1]); bback.rotation.y = bbSpots[bb][2] + Math.PI;
    scene.add(bback);
  }
  // ---- BATTLEFIELD zone (NE) — sandbag walls + barbed wire ----
  var sandMat = new THREE.MeshLambertMaterial({ color:0xb8a06a });
  var sandSpots = [[35,49],[49,35],[49,63],[63,49],[77,49],[49,77],[35,63],[63,77],[70,35]];
  for (var sb=0; sb<sandSpots.length; sb++){
    var swx = sandSpots[sb][0], swz = sandSpots[sb][1];
    var wallG = new THREE.Group(); wallG.position.set(swx,0,swz); wallG.rotation.y = Math.random()*Math.PI;
    for (var sl=0; sl<3; sl++){
      for (var sc=-1; sc<=1; sc++){
        var bag = new THREE.Mesh(new THREE.SphereGeometry(0.34,7,5), sandMat);
        bag.scale.set(1.6,0.5,0.9);
        bag.position.set(sc*0.55 + (sl%2)*0.27, 0.17 + sl*0.3, (Math.random()-0.5)*0.08);
        wallG.add(bag);
      }
    }
    for (var bk=0; bk<wallG.children.length; bk++) blockers.push(wallG.children[bk]);
    scene.add(wallG);
    obstacles.push({ x1:swx-1.5, z1:swz-1.1, x2:swx+1.5, z2:swz+1.1 });
  }
  var wireMat = new THREE.MeshLambertMaterial({ color:0x4a4a42 });
  for (var wp=0; wp<16; wp++){
    var wpx = 36 + Math.random()*42, wpz = 36 + Math.random()*42;
    var wp1 = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.15,5), wireMat);
    wp1.position.set(wpx, 0.57, wpz); scene.add(wp1);
    var wp2 = wp1.clone(); wp2.position.set(wpx+1.5, 0.57, wpz+0.7); scene.add(wp2);
    var wln = new THREE.Mesh(new THREE.BoxGeometry(1.75,0.02,0.02), wireMat);
    wln.position.set(wpx+0.75, 0.95, wpz+0.35); wln.rotation.y = -Math.atan2(0.7,1.5); scene.add(wln);
    var wln2 = wln.clone(); wln2.position.y = 0.55; scene.add(wln2);
  }
  // ---- GREEN RESORT zone (SW) — oasis: grass, pool, palms, umbrellas ----
  var grassMat2 = new THREE.MeshLambertMaterial({ color:0x3a6a2e });
  for (var gp2=0; gp2<12; gp2++){
    var gpch = new THREE.Mesh(new THREE.CircleGeometry(5+Math.random()*8, 9), grassMat2);
    gpch.rotation.x = -Math.PI/2;
    gpch.position.set(-40 - Math.random()*34, 0.025, 40 + Math.random()*34);
    scene.add(gpch);
  }
  var poolMat = new THREE.MeshLambertMaterial({ color:0x2e8ab0, emissive:0x061828 });
  var pool = new THREE.Mesh(new THREE.CircleGeometry(7, 22), poolMat);
  pool.rotation.x = -Math.PI/2; pool.position.set(-52, 0.05, 56); scene.add(pool);
  var rimMat = new THREE.MeshLambertMaterial({ color:0xd8d0b8 });
  var poolRim = new THREE.Mesh(new THREE.RingGeometry(7, 8.4, 22), rimMat);
  poolRim.rotation.x = -Math.PI/2; poolRim.position.set(-52, 0.045, 56); scene.add(poolRim);
  var trunkM2 = new THREE.MeshLambertMaterial({ color:0x8a6a42 });
  var frondM = new THREE.MeshLambertMaterial({ color:0x3a8a3a });
  var palmSpots = [[-40,46],[-46,38],[-60,42],[-66,54],[-60,70],[-46,72],[-36,58],[-70,64],[-42,52]];
  for (var pm=0; pm<palmSpots.length; pm++){
    var pg2 = new THREE.Group(); pg2.position.set(palmSpots[pm][0], 0, palmSpots[pm][1]);
    var ptrunk = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.2,3.0,6), trunkM2);
    ptrunk.position.y = 1.5; ptrunk.rotation.z = (Math.random()-0.5)*0.16; pg2.add(ptrunk);
    for (var pl=0; pl<6; pl++){
      var fHead = new THREE.Group(); fHead.position.y = 3.0; fHead.rotation.y = pl/6*Math.PI*2; pg2.add(fHead);
      var frondGeo = new THREE.BoxGeometry(1.9,0.05,0.42);
      frondGeo.translate(0.95,0,0);
      var frond = new THREE.Mesh(frondGeo, frondM);
      frond.rotation.z = -0.5;
      fHead.add(frond);
    }
    scene.add(pg2); blockers.push(ptrunk);
  }
  var umbM = new THREE.MeshLambertMaterial({ color:0xe8e0d0 });
  var umbSpots = [[-44,64],[-60,48],[-36,50]];
  for (var us=0; us<umbSpots.length; us++){
    var upole = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,2.2,5), rimMat);
    upole.position.set(umbSpots[us][0], 1.1, umbSpots[us][1]); scene.add(upole);
    var utop = new THREE.Mesh(new THREE.ConeGeometry(1.3,0.5,8), umbM);
    utop.position.set(umbSpots[us][0], 2.3, umbSpots[us][1]); scene.add(utop);
    var loung = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.22,1.3), umbM);
    loung.position.set(umbSpots[us][0]+1.7, 0.13, umbSpots[us][1]+0.7); loung.rotation.y = (Math.random()-0.5)*0.5;
    scene.add(loung);
  }
  // sand berms (desert edge)
  var bermMat = new THREE.MeshLambertMaterial({ color:0xb28a55 });
  [[0,-100,200,4],[0,100,200,4],[-100,0,4,200],[100,0,4,200]].forEach(function(bd){
    var berm = new THREE.Mesh(new THREE.BoxGeometry(bd[2],3,bd[3]), bermMat);
    berm.position.set(bd[0], 1.5, bd[1]); scene.add(berm);
  });
  // ---- WAR ZONE: craters, rubble, burning fires, smoke plumes ----
  var craterMat = new THREE.MeshLambertMaterial({ color:0x2a2018 });
  var rubbleMat = new THREE.MeshLambertMaterial({ color:0x4a4238 });
  for (var cr=0; cr<8; cr++){
    var crx = (Math.random()-0.5)*150, crz = (Math.random()-0.5)*150;
    if (Math.abs(crx)<18 && Math.abs(crz)<18){ crx += 26; }
    var crater = new THREE.Mesh(new THREE.CircleGeometry(2+Math.random()*2.5, 9), craterMat);
    crater.rotation.x = -Math.PI/2; crater.position.set(crx, 0.04, crz); scene.add(crater);
    for (var rb=0; rb<4; rb++){
      var rub = new THREE.Mesh(new THREE.BoxGeometry(0.3+Math.random()*0.5,0.2+Math.random()*0.3,0.3+Math.random()*0.5), rubbleMat);
      rub.position.set(crx+(Math.random()-0.5)*5, 0.15, crz+(Math.random()-0.5)*5);
      rub.rotation.set(Math.random(),Math.random(),Math.random());
      scene.add(rub); blockers.push(rub);
    }
  }
  var fireCore = new THREE.MeshBasicMaterial({ color:0xff7a18 });
  var fireTip  = new THREE.MeshBasicMaterial({ color:0xffd23c });
  var glowMat  = new THREE.MeshBasicMaterial({ color:0xff6a10, transparent:true, opacity:0.3 });
  var smokeMat = new THREE.MeshLambertMaterial({ color:0x2e2a26, transparent:true, opacity:0.5 });
  var fireSpots = [[22,-18],[-30,26],[8,38],[-18,-38],[46,12],[-52,-14],[34,42],[-44,36]];
  for (var fs=0; fs<fireSpots.length; fs++){
    var fx = fireSpots[fs][0], fz = fireSpots[fs][1];
    var glow = new THREE.Mesh(new THREE.CircleGeometry(1.7,10), glowMat.clone());
    glow.rotation.x = -Math.PI/2; glow.position.set(fx,0.05,fz); scene.add(glow);
    var f1 = new THREE.Mesh(new THREE.ConeGeometry(0.35,1.0,6), fireCore);
    f1.position.set(fx,0.6,fz); scene.add(f1);
    var f2 = new THREE.Mesh(new THREE.ConeGeometry(0.22,0.7,6), fireTip);
    f2.position.set(fx,1.05,fz); scene.add(f2);
    warFires.push({ m:f1, t:f2, g:glow, ph:Math.random()*10 });
    for (var sm=0; sm<3; sm++){
      var puff = new THREE.Mesh(new THREE.SphereGeometry(0.7+sm*0.25,8,8), smokeMat.clone());
      puff.position.set(fx, 1.8+sm*1.1, fz);
      scene.add(puff);
      warSmokes.push({ m:puff, ph:Math.random()*3, y0:1.8+sm*1.1 });
    }
  }
  // dust particles
  var N = 380, pos = new Float32Array(N*3);
  for (var dp=0; dp<N; dp++){ pos[dp*3]=(Math.random()-0.5)*170; pos[dp*3+1]=Math.random()*14; pos[dp*3+2]=(Math.random()-0.5)*170; }
  dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  var dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color:0xe8c9a0, size:0.14, transparent:true, opacity:0.55 }));
  scene.add(dust);
  muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.09,6,6), new THREE.MeshBasicMaterial({ color:0xffd070 }));
  muzzleFlash.visible = false; scene.add(muzzleFlash);
  for (var ti=0; ti<6; ti++){
    var tr3 = new THREE.Mesh(new THREE.BoxGeometry(0.03,0.03,1), new THREE.MeshBasicMaterial({ color:0xffc878, transparent:true, opacity:0.85 }));
    tr3.visible = false; tr3.userData.t = 0; scene.add(tr3); tracerPool.push(tr3);
  }
  for (var pi=0; pi<70; pi++){
    var pp = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,0.09), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true }));
    pp.visible = false; pp.userData.v = new THREE.Vector3(); pp.userData.t = 0;
    scene.add(pp); partPool.push(pp);
  }
}

// ---------------- HUMAN BUILDER (original characters) ----------------
function addFace(head){
  var eyeW = new THREE.MeshLambertMaterial({ color:0xf0ece0 });
  var eyeB = new THREE.MeshLambertMaterial({ color:0x14100c });
  var brM  = new THREE.MeshLambertMaterial({ color:0x2a2018 });
  var eL = new THREE.Mesh(new THREE.SphereGeometry(0.022,6,6), eyeW); eL.position.set(-0.05, 0.02, 0.115); head.add(eL);
  var eR = eL.clone(); eR.position.x = 0.05; head.add(eR);
  var pL = new THREE.Mesh(new THREE.SphereGeometry(0.011,6,6), eyeB); pL.position.set(-0.05, 0.02, 0.132); head.add(pL);
  var pR = pL.clone(); pR.position.x = 0.05; head.add(pR);
  var bL = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.012,0.012), brM); bL.position.set(-0.05, 0.062, 0.122); head.add(bL);
  var bR = bL.clone(); bR.position.x = 0.05; head.add(bR);
  var mo = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.012,0.01), brM); mo.position.set(0,-0.058,0.122); head.add(mo);
}
function addZFace(head, eyeMat){
  var soL = new THREE.Mesh(new THREE.BoxGeometry(0.045,0.03,0.02), eyeMat); soL.position.set(-0.05, 0.02, 0.12); head.add(soL);
  var soR = soL.clone(); soR.position.x = 0.05; head.add(soR);
  var mo = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.035,0.015), eyeMat); mo.position.set(0,-0.06,0.12); head.add(mo);
}
function addHair(head, L){
  var hairMat = new THREE.MeshLambertMaterial({ color:L.hair });
  var st = L.style;
  if (st === 'buzz'){
    var h = new THREE.Mesh(new THREE.SphereGeometry(0.148,10,8,0,Math.PI*2,0,Math.PI/2.6), hairMat);
    h.scale.set(1,0.62,1); head.add(h);
  } else if (st === 'pony'){
    var h2 = new THREE.Mesh(new THREE.SphereGeometry(0.152,10,8,0,Math.PI*2,0,Math.PI/2), hairMat);
    h2.scale.set(1,0.85,1); head.add(h2);
    var tail = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.05,0.3,6), hairMat);
    tail.position.set(0,-0.05,-0.17); tail.rotation.x = 0.5; head.add(tail);
  } else if (st === 'bandana'){
    var cap = new THREE.Mesh(new THREE.SphereGeometry(0.15,10,8,0,Math.PI*2,0,Math.PI/2.4), new THREE.MeshLambertMaterial({ color:L.band }));

// ---------------- ZOMBIE (WALKER — human body) ----------------
var zSkinPal = [0x6f8a5a, 0x7a8a5f, 0x5f7a4a];
var zShirtPal = [0x5a5148, 0x4a4038, 0x503f3a, 0x40484a];
function makeZombie(x, z){
  var tint = 0.85 + Math.random()*0.3;
  var skinMat = new THREE.MeshLambertMaterial({ color:new THREE.Color(zSkinPal[Math.floor(Math.random()*3)]).multiplyScalar(tint) });
  var shirtMat = new THREE.MeshLambertMaterial({ color:zShirtPal[Math.floor(Math.random()*4)] });
  var eyeMat = new THREE.MeshLambertMaterial({ color:0x180a08 });
  var look = { skin:skinMat.color.getHex(), shirt:shirtMat.color.getHex(), pants:0x3a3f45, vest:0x3a3632, boots:0x2a2422 };
  var hu = makeHuman(look, false, { eye:eyeMat });
  hu.g.traverse(function(o){ if (o.isMesh){
    if (o.material.color && o.material.color.getHex() === look.skin) o.material = skinMat;
    else if (o.material.color && o.material.color.getHex() === look.shirt) o.material = shirtMat;
    else if (o.material.color && o.material.color.getHex() === 0x3a3f45) o.material = new THREE.MeshLambertMaterial({ color:0x3a3f45 });
  }});
  hu.mats = [skinMat, shirtMat];
  hu.g.position.set(x, 0, z);
  scene.add(hu.g);
  hu.refs.armR.rotation.x = -1.3; hu.refs.armL.rotation.x = -1.3;
  var z_ = {
    g:hu.g, refs:hu.refs, mats:[skinMat, shirtMat],
    hp:100, t:Math.random()*10, speed:1.15 + Math.random()*0.4 + (state.wave-1)*0.06,
    dead:false, dieT:0, atkCd:0, atkAnim:0, wanderT:0, wx:x, wz:z, flashT:0
  };
  hu.g.traverse(function(o){ if (o.isMesh){ o.userData.z = z_; } });
  hu.refs.head.traverse(function(o){ if (o.isMesh) o.userData.head = true; });
  hu.g.traverse(function(o){ if (o.isMesh) zHitParts.push(o); });
  zombies.push(z_);
  state.alive++;
  return z_;
}

function spawnWave(n){
  var count = Math.min(CFG.maxZ, 3 + n * 2);
  for (var i=0; i<count; i++){
    var ang = Math.random()*Math.PI*2;
    var r = 25 + Math.random()*15;
    var sx = player.g.position.x + Math.sin(ang)*r;
    var sz = player.g.position.z + Math.cos(ang)*r;
    sx = Math.max(-CFG.bound, Math.min(CFG.bound, sx));
    sz = Math.max(-CFG.bound, Math.min(CFG.bound, sz));
    makeZombie(sx, sz);
  }
  banner(T('wave') + ' ' + n, 2200);
  sWave();
}

// ---------------- COMBAT ----------------
function shoot(){
  if (state.reloading || state.over) return;
  if (state.ammo <= 0){ sEmpty(); startReload(); return; }
  state.ammo--;
  state.shootCd = CFG.fireRate * CHAR().rate;
  sShoot(CHAR().gun);
  updateHUD();
  player.refs.muzzle.getWorldPosition(V0);
  muzzleFlash.position.copy(V0); muzzleFlash.visible = true;
  setTimeout(function(){ muzzleFlash.visible = false; }, 55);
  raycaster.setFromCamera({ x:0, y:0 }, camera);
  var hits = raycaster.intersectObjects(zHitParts.concat(blockers), false);
  if (hits.length > 0){
    var h = hits[0];
    tracer(V0, h.point);
    var zz = h.object.userData.z;
    if (zz && !zz.dead){
      var dmg = (h.object.userData.head ? CFG.headDmg : CFG.shootDmg) * CHAR().dmg;
      hitZombie(zz, dmg, h.point);
      flashCrosshair();
    } else {
      burst(h.point, 0xb9a077, 5, 2.2, 0.4);
    }
  } else {
    V1.copy(V0); V2.set(0,0,-1).applyQuaternion(camera.quaternion).multiplyScalar(60).add(V0);
    tracer(V0, V2);
  }
  if (state.ammo <= 0) startReload();
}
function startReload(){
  if (state.reloading || state.ammo === CFG.magSize) return;
  state.reloading = true; state.reloadT = CFG.reloadTime;
  sReload();
  say('Reloading');
}
function hitZombie(z, dmg, point){
  z.hp -= dmg; z.flashT = 0.12;
  burst(point, 0x8a1010, 9, 3, 0.8);
  sHit();
  if (z.hp <= 0 && !z.dead){
    z.dead = true; z.dieT = 0; sZScream(); sZDie();
    state.kills++; state.alive--;
    updateHUD();
    for (var i=zHitParts.length-1; i>=0; i--) if (zHitParts[i].userData.z === z) zHitParts.splice(i,1);
    if (state.alive <= 0) waveCleared();
  }
}
function playerHit(d){
  if (state.over) return;
  state.hp -= d; state.lastHitT = performance.now()/1000;
  sHurt(); sGrunt(CHAR().voice);
  var vg = document.getElementById('vignette');
  vg.style.opacity = 0.9;
  setTimeout(function(){ vg.style.opacity = state.hp < 30 ? 0.35 : 0; }, 260);
  updateHUD();
  if (state.hp <= 0){ state.hp = 0; diePlayer(); }
}
function diePlayer(){
  state.over = true;
  document.getElementById('deathStats').textContent = T('wave') + ' ' + state.wave + ' — ' + state.kills + ' ' + T('kills');
  document.getElementById('deathScreen').classList.remove('hidden');
  ['topbar','crosshair','stickZone','lookZone','btnShoot','btnReload','zoneTxt'].forEach(function(id){
    document.getElementById(id).classList.add('hidden');
  });
  tone('sawtooth', 220, 30, 1.2, 0.25);
  say('You died');
}
function waveCleared(){
  banner(T('cleared'), 2000);
  say('Area clear');
  setTimeout(function(){ if (!state.over){ banner(T('next'), 1800); } }, 2100);
  setTimeout(function(){
    if (!state.over){ state.wave++; spawnWave(state.wave); updateHUD(); }
  }, 4200);
}

// ---------------- FX ----------------
function tracer(a, b){
  var t = null;
  for (var i=0;i<tracerPool.length;i++){ if (!tracerPool[i].visible){ t = tracerPool[i]; break; } }
  if (!t) return;
  var len = a.distanceTo(b);
  t.position.copy(a).add(b).multiplyScalar(0.5);
  t.lookAt(b);
  t.scale.set(1,1,len);
  t.visible = true; t.userData.t = 0.09;
}
function burst(pos, color, n, spd, grav){
  var used = 0;
  for (var i=0;i<partPool.length && used<n;i++){
    var p = partPool[i];
    if (p.visible) continue;
    used++;
    p.visible = true; p.userData.t = 0.55; p.userData.g = grav || 0.5;

  }
}

  else zn = 'THE RUINS';
  if (zn !== state.zone){
    state.zone = zn;

  }

// ---------------- COLLISION ----------------
function pushOut(pos, r){
  for (var i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    if (pos.x > o.x1-r && pos.x < o.x2+r && pos.z > o.z1-r && pos.z < o.z2+r){
      var dl = pos.x - (o.x1-r), dr = (o.x2+r) - pos.x, dt2 = pos.z - (o.z1-r), db = (o.z2+r) - pos.z;
      var m = Math.min(dl, dr, dt2, db);
      if (m === dl) pos.x = o.x1 - r;
      else if (m === dr) pos.x = o.x2 + r;
      else if (m === dt2) pos.z = o.z1 - r;
      else pos.z = o.z2 + r;
    }
  }
  pos.x = Math.max(-CFG.bound, Math.min(CFG.bound, pos.x));
  pos.z = Math.max(-CFG.bound, Math.min(CFG.bound, pos.z));
}

// ---------------- INPUT ----------------
var stickId = null, lookId = null, lookLast = { x:0, y:0 };
var stickBase, stickKnob;
function initInput(){
  stickBase = document.getElementById('stickBase');
  stickKnob = document.getElementById('stickKnob');
  var zone = document.getElementById('stickZone');
  zone.addEventListener('pointerdown', function(e){
    if (stickId !== null) return;
    stickId = e.pointerId; state.hasStick = true;
    moveStick(e);
    e.preventDefault();
  });
  window.addEventListener('pointermove', function(e){
    if (e.pointerId === stickId) moveStick(e);
    else if (e.pointerId === lookId){
      state.yaw -= (e.clientX - lookLast.x) * 0.0048;
      state.pitch = Math.max(0.08, Math.min(0.65, state.pitch + (e.clientY - lookLast.y) * 0.0022));
      lookLast.x = e.clientX; lookLast.y = e.clientY;
    }
  });
  window.addEventListener('pointerup', function(e){
    if (e.pointerId === stickId){ stickId = null; state.jx = 0; state.jy = 0; state.hasStick = false;
      stickKnob.style.transform = 'translate(-50%,-50%)'; }
    if (e.pointerId === lookId) lookId = null;
  });
  var look = document.getElementById('lookZone');
  look.addEventListener('pointerdown', function(e){
    if (lookId !== null) return;
    lookId = e.pointerId; lookLast.x = e.clientX; lookLast.y = e.clientY;
    e.preventDefault();
  });
  var bs = document.getElementById('btnShoot');
  bs.addEventListener('pointerdown', function(e){
    e.preventDefault(); e.stopPropagation();
    state.shootHeld = true; shoot();
  });
  bs.addEventListener('pointerup', function(){ state.shootHeld = false; });
  bs.addEventListener('pointercancel', function(){ state.shootHeld = false; });
  document.getElementById('btnReload').addEventListener('pointerdown', function(e){
    e.preventDefault(); e.stopPropagation(); startReload();
  });
  window.addEventListener('keydown', function(e){ keys[e.code] = true;
    if (e.code === 'KeyR') startReload();
    if (e.code === 'Space'){ state.shootHeld = true; }
  });
  window.addEventListener('keyup', function(e){ keys[e.code] = false;
    if (e.code === 'Space') state.shootHeld = false;
  });
  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}
function moveStick(e){
  var rect = stickBase.getBoundingClientRect();
  var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  var dx = e.clientX - cx, dy = e.clientY - cy;
  var max = rect.width/2;
  var d = Math.min(Math.hypot(dx,dy), max);
  var ang = Math.atan2(dy,dx);
  var kx = Math.cos(ang)*d, ky = Math.sin(ang)*d;
  stickKnob.style.transform = 'translate(calc(-50% + ' + kx + 'px), calc(-50% + ' + ky + 'px))';
  state.jx = kx/max; state.jy = ky/max;
}

// ---------------- MAIN LOOP ----------------
var lastGrowl = 0, lobbyT = 0;
function animate(){
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);
  var now = performance.now()/1000;
  if (!state.hasStick){
    var kx = (keys['KeyD']||keys['ArrowRight']?1:0) - (keys['KeyA']||keys['ArrowLeft']?1:0);
    var ky = (keys['KeyS']||keys['ArrowDown']?1:0) - (keys['KeyW']||keys['ArrowUp']?1:0);
    state.jx = kx; state.jy = ky;
  }
  if (state.started && !state.over){
    var mag = Math.min(1, Math.hypot(state.jx, state.jy));
    if (mag > 0.05){
      var spd = mag * (mag > 0.92 ? CFG.sprintSpeed : CFG.walkSpeed) * CHAR().spd;
      var f = V0.set(-Math.sin(state.yaw), 0, -Math.cos(state.yaw));
      var rt = V1.set(-f.z, 0, f.x);
      var mx = (f.x * -state.jy + rt.x * state.jx) / Math.max(0.001, mag);
      var mz = (f.z * -state.jy + rt.z * state.jx) / Math.max(0.001, mag);
      player.g.position.x += mx * spd * dt;
      player.g.position.z += mz * spd * dt;
      pushOut(player.g.position, 0.45);
      state.walkT += dt * (6 + mag*6);
      var face = state.shootHeld ? Math.atan2(f.x, f.z) : Math.atan2(mx, mz);
      var cur = player.g.rotation.y;
      var diff = face - cur;
      while (diff > Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;
      player.g.rotation.y = cur + diff * Math.min(1, dt*12);
    } else if (state.shootHeld){
      player.g.rotation.y = Math.atan2(-Math.sin(state.yaw), -Math.cos(state.yaw));
    }
    var sw = mag > 0.05 ? Math.sin(state.walkT)*0.55*mag : 0;
    player.refs.hipL.rotation.x = sw;
    player.refs.hipR.rotation.x = -sw;
    if (player.refs.kneeL){ player.refs.kneeL.rotation.x = Math.max(0, -sw*1.1); player.refs.kneeR.rotation.x = Math.max(0, sw*1.1); }
    player.refs.torsoMesh.position.y = (player.refs.torsoBaseY || 1.32) + Math.abs(Math.sin(state.walkT))*0.02;
    if (player.refs.gun) player.refs.gun.rotation.x = state.reloading ? 0.55 : 0.06;
    var wantFov = (mag > 0.92 && mag <= 1) ? 76 : 70;
    camera.fov += (wantFov - camera.fov) * Math.min(1, dt*5);
    camera.updateProjectionMatrix();
    if (now - state.lastHitT > 6 && state.hp > 0 && state.hp < state.hpMax){
      state.hp = Math.min(state.hpMax, state.hp + dt*2.5);
      updateHUD();
    }
    updateZone();
    state.shootCd -= dt;
    if (state.shootHeld && state.shootCd <= 0) shoot();
    if (state.reloading){
      state.reloadT -= dt;
      if (state.reloadT <= 0){ state.reloading = false; state.ammo = CFG.magSize; updateHUD(); }
    }
    // distant sirens (ambulance / police atmosphere)
    if (state.started){
      state.sirenT -= dt;
      if (state.sirenT <= 0){
        state.sirenT = 22 + Math.random()*26;
        sSiren(Math.random() < 0.5 ? 'amb' : 'pol');
      }
      boomT -= dt;
      if (boomT <= 0){ boomT = 18 + Math.random()*22; sBoom(); }
    }
    // zombies
    var px = player.g.position.x, pz = player.g.position.z;
    for (var zi=0; zi<zombies.length; zi++){
      var z = zombies[zi];
      if (z.dead){
        z.dieT += dt;
        z.g.rotation.x = -Math.min(1, z.dieT/0.5) * Math.PI/2;
        if (z.dieT > 1.4){
          var op = Math.max(0, 1 - (z.dieT-1.4)/0.8);
          for (var mi=0; mi<z.mats.length; mi++){ z.mats[mi].transparent = true; z.mats[mi].opacity = op; }
        }
        if (z.dieT > 2.3){ scene.remove(z.g); zombies.splice(zi,1); zi--; }
        continue;
      }
      var dx = px - z.g.position.x, dz = pz - z.g.position.z;
      var dist = Math.hypot(dx, dz);
      z.t += dt * (dist < CFG.detectRange ? 3.2 : 1.4);
      if (z.flashT > 0){
        z.flashT -= dt;
        var em = z.flashT > 0 ? 0x7a1010 : 0x000000;
        for (var ei=0; ei<z.mats.length; ei++) z.mats[ei].emissive.setHex(em);
      }
      if (dist < CFG.attackRange){
        if (z.atkCd <= 0){
          z.atkCd = 1.15; z.atkAnim = 0.32;
          playerHit(CFG.zombieDmg + Math.floor(state.wave/2));
          if (now - lastGrowl > 0.5){ sGrowl(); lastGrowl = now; }
        }
        z.g.rotation.y = Math.atan2(dx, dz);
      } else if (dist < CFG.detectRange){
        var sp = z.speed;
        z.g.position.x += (dx/dist) * sp * dt;
        z.g.position.z += (dz/dist) * sp * dt;
        pushOut(z.g.position, 0.42);
        z.g.rotation.y = Math.atan2(dx, dz);
        if (now - lastGrowl > 1.4 && Math.random() < dt*0.5){ sGrowl(); lastGrowl = now; }
      } else {
        z.wanderT -= dt;
        if (z.wanderT <= 0){
          z.wanderT = 3 + Math.random()*3;
          z.wx = Math.max(-CFG.bound, Math.min(CFG.bound, z.g.position.x + (Math.random()-0.5)*24));
          z.wz = Math.max(-CFG.bound, Math.min(CFG.bound, z.g.position.z + (Math.random()-0.5)*24));
        }
        var wdx = z.wx - z.g.position.x, wdz = z.wz - z.g.position.z;
        var wd = Math.hypot(wdx, wdz);
        if (wd > 1){
          z.g.position.x += (wdx/wd) * z.speed * 0.35 * dt;
          z.g.position.z += (wdz/wd) * z.speed * 0.35 * dt;
          pushOut(z.g.position, 0.42);
          z.g.rotation.y = Math.atan2(wdx, wdz);
        }
      }
      z.atkCd -= dt;
      if (z.atkAnim > 0) z.atkAnim -= dt;
      var swing = Math.sin(z.t);
      z.refs.hipL.rotation.x = swing * 0.4;
      z.refs.hipR.rotation.x = -swing * 0.4;
      if (z.atkAnim > 0){
        z.refs.armL.rotation.x = -0.35 - Math.sin((0.32 - z.atkAnim)/0.32 * Math.PI) * 0.8;
        z.refs.armR.rotation.x = -0.35 - Math.sin((0.32 - z.atkAnim)/0.32 * Math.PI) * 0.8;
      } else {
        z.refs.armL.rotation.x = -1.3 + Math.sin(z.t*1.3) * 0.08;
        z.refs.armR.rotation.x = -1.3 - Math.sin(z.t*1.3) * 0.08;
      }
      z.g.position.y = Math.abs(Math.sin(z.t)) * 0.05;
      z.refs.head.rotation.z = 0.14 + Math.sin(z.t*0.7)*0.08;
    }
  }
  // emergency light bars blink forever (the city never sleeps)
  for (var lb=0; lb<lightbars.length; lb++){
    var L2 = lightbars[lb];
    L2.t += dt;
    var ph = Math.sin(L2.t * 6) > 0;
    L2.r.material.emissive.setHex(ph ? 0xff2010 : 0x220602);
    L2.b.material.emissive.setHex(ph ? 0x0a1030 : 0x2040ff);
  }
  // camera
  var cp = player.g.position;
  if (!state.started){
    // LOBBY SHOWCASE — character rotates like a real game lobby
    lobbyT += dt;
    var lr = 4.4;
    camera.position.set(cp.x + Math.sin(lobbyT*0.45)*lr, 2.05, cp.z + Math.cos(lobbyT*0.45)*lr);
    camera.lookAt(cp.x, 1.2, cp.z);
    player.g.rotation.y = Math.atan2(camera.position.x - cp.x, camera.position.z - cp.z);
    if (player.refs.torsoMesh) player.refs.torsoMesh.position.y = (player.refs.torsoBaseY || 1.46) + Math.sin(lobbyT*2.2)*0.012;
  } else {
    var camDist = 6.4, camH = 3.0 + state.pitch * 2.6;
    camera.position.set(cp.x + Math.sin(state.yaw) * camDist, camH, cp.z + Math.cos(state.yaw) * camDist);
    camera.lookAt(cp.x, 1.55, cp.z);
  }
  // dust
  var pa = dustGeo.attributes.position, arr = pa.array;
  for (var di=0; di<arr.length; di+=3){
    arr[di] += dt * 1.1; arr[di+1] -= dt * 0.35;
    if (arr[di+1] < 0){ arr[di+1] = 12 + Math.random()*4; }
    if (arr[di] > 88){ arr[di] = -88; }
  }
  pa.needsUpdate = true;
  for (var ti2=0; ti2<tracerPool.length; ti2++){
    var tr2 = tracerPool[ti2];
    if (tr2.visible){ tr2.userData.t -= dt; if (tr2.userData.t <= 0) tr2.visible = false; }
  }
  for (var pi2=0; pi2<partPool.length; pi2++){
    var pp2 = partPool[pi2];
    if (!pp2.visible) continue;
    pp2.userData.t -= dt;
    if (pp2.userData.t <= 0){ pp2.visible = false; continue; }
    pp2.userData.v.y -= dt * 9 * (pp2.userData.g || 0.5);
    pp2.position.x += pp2.userData.v.x * dt;
    pp2.position.y += pp2.userData.v.y * dt;
    pp2.position.z += pp2.userData.v.z * dt;
    if (pp2.position.y < 0.05) pp2.position.y = 0.05;
    pp2.material.opacity = Math.min(1, pp2.userData.t / 0.3);
  }
  renderer.render(scene, camera);
}
