<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BLABLA — NOVA</title>
<link rel="manifest" href="blabla-manifest.json">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#fff}
.page{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
.top{display:flex;align-items:center;gap:8px;background:#111;padding:10px 12px;flex-shrink:0}
.back{background:#262626;border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.ttl{font-weight:900;font-size:16px;letter-spacing:.05em}
.live{font-size:11px;font-weight:700;color:#fff;background:#f3425f;border-radius:6px;padding:3px 8px}
.viewers{display:inline-block;font-size:12px;font-weight:700;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:12px;margin-left:auto}
.addb{background:linear-gradient(135deg,#00AEEC,#FB7299);border:none;color:#fff;width:34px;height:34px;border-radius:12px;font-size:18px;cursor:pointer;font-weight:900}
.tabrow{display:flex;background:#0d0d0d;flex-shrink:0}
.tabb{flex:1;padding:11px;border:none;background:none;color:#777;font-weight:800;font-size:14px;cursor:pointer;border-bottom:3px solid transparent}
.tabb.on{color:#fff;border-bottom:3px solid #FB7299}
.stage{flex:1;min-height:0;position:relative;background:#050505}
.reels{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;position:relative;overflow:hidden;background:#111}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 18s ease-in-out infinite alternate}
.bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.14) translate(-2.5%,2.5%)}}
.shade{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(transparent,rgba(0,0,0,.68))}
.rail{position:absolute;right:10px;bottom:96px;display:flex;flex-direction:column;gap:16px;align-items:center;z-index:3}
.rb{background:none;border:none;color:#fff;font-size:30px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1;padding:0}
.cnt{font-size:12px;font-weight:700;margin-top:5px}
.caption{position:absolute;left:12px;right:70px;bottom:14px;color:#fff;pointer-events:none;z-index:3}
.tag{color:#00AEEC;font-weight:800;pointer-events:auto}
.disc{display:inline-block;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wm{position:absolute;top:12px;left:12px;z-index:3;font-size:11px;font-weight:800;color:rgba(255,255,255,.8);background:rgba(0,0,0,.35);padding:4px 10px;border-radius:10px}
.np{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:6px 14px;border-radius:16px;font-size:12px;font-weight:700;z-index:5;display:none;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logoChip{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#00AEEC,#FB7299);padding:5px 12px;border-radius:10px;font-weight:900;font-size:15px;letter-spacing:.04em;color:#fff}
.chatmsgs{position:absolute;left:10px;right:70px;bottom:14px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-height:30vh;overflow:hidden;z-index:4}
.msg{background:rgba(0,0,0,.55);color:#fff;padding:6px 11px;border-radius:16px;font-size:13px;width:fit-content;max-width:100%}
.liveStage{position:absolute;inset:0;display:none}
.liveStage.on{display:block}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.who{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);padding:5px 12px;border-radius:14px;font-size:13px;font-weight:700;z-index:5;display:none}
.mute{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:16px;cursor:pointer;z-index:5;display:none}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
.bigbtn{border:none;border-radius:14px;padding:16px 26px;font-size:16px;font-weight:900;color:#fff;width:min(80vw,320px);cursor:pointer}
.hostbtn{background:linear-gradient(135deg,#00AEEC,#FB7299)}
.watchbtn{background:linear-gradient(135deg,#f3425f,#ff7a59)}
.hint{font-size:12px;color:#999;max-width:320px;line-height:1.7}
.ctrls{position:absolute;bottom:24px;left:0;right:0;display:none;justify-content:space-around;align-items:center;z-index:5}
.camb{background:rgba(0,0,0,.55);color:#fff;border:none;width:46px;height:46px;border-radius:50%;font-size:20px;cursor:pointer}
.snapbtn{width:64px;height:64px;border-radius:50%;background:#f3425f;border:4px solid #fff;cursor:pointer}
.stopbtn{background:#f3425f}
.closex{position:absolute;top:56px;right:10px;display:none;z-index:6}
.giftbtn{position:absolute;bottom:76px;right:12px;z-index:5}
.giftPanel{position:absolute;left:0;right:0;bottom:0;background:#1a1a1a;border-top-left-radius:18px;border-top-right-radius:18px;padding:14px;z-index:9;display:none;max-height:46%;overflow-y:auto}
.giftPanel.on{display:block}
.gpHead{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;margin-bottom:12px}
.gpWallet{margin-left:auto;font-size:13px;background:#262626;padding:6px 12px;border-radius:14px}
.gpWallet button{background:#FB7299;border:none;color:#fff;border-radius:12px;padding:3px 8px;font-weight:800;cursor:pointer}
.gpx{background:#262626;border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer}
.gpGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gitem{background:#262626;border:none;border-radius:12px;padding:12px 4px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.gitem:active{transform:scale(.95)}
.gitem .ge{font-size:30px}
.gitem .gc{font-size:11px;font-weight:700;color:#FB7299}
.biggift{position:absolute;bottom:42%;left:50%;font-size:86px;z-index:8;pointer-events:none;animation:flyup 2.2s forwards}
@keyframes flyup{0%{opacity:0;transform:translateX(-50%) scale(.3)}25%{opacity:1;transform:translateX(-50%) scale(1.25)}100%{opacity:0;transform:translateX(-50%) scale(1.5) translateY(-38vh)}}
.musicPanel{position:absolute;left:0;right:0;bottom:0;background:#1a1a1a;border-top-left-radius:18px;border-top-right-radius:18px;padding:14px;z-index:9;display:none;max-height:52%;overflow-y:auto}
.musicPanel.on{display:block}
.srow{display:flex;align-items:center;gap:12px;background:#262626;border-radius:12px;padding:10px 12px;margin-bottom:10px;border:1px solid transparent}
.srow.on{border-color:#FB7299}
.splay{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,#00AEEC,#FB7299);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0}
.tagPanel{position:absolute;left:0;right:0;bottom:0;background:#1a1a1a;border-top-left-radius:18px;border-top-right-radius:18px;padding:14px;z-index:9;display:none;max-height:52%;overflow-y:auto}
.tagPanel.on{display:block}
.createUI{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
.createUI.on{display:flex}
.createUI video{flex:1;min-height:0;width:100%;object-fit:cover}
.recTop{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.rectime{background:rgba(0,0,0,.6);padding:6px 12px;border-radius:12px;font-weight:800;font-size:14px;display:none}
.recFlip{position:absolute;bottom:170px;right:12px;z-index:2}
.recBottom{position:absolute;bottom:24px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:2}
.recHint{font-size:12px;color:#eee;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:12px;text-align:center}
.recording{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.recSave{position:absolute;bottom:24px;left:0;right:0;display:none;flex-direction:column;gap:10px;padding:0 14px;z-index:2}
.recSave input{border:none;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:12px 14px;outline:none;font-size:14px;width:100%}
.chatbar{display:flex;gap:8px;padding:10px;background:#000;flex-shrink:0}
.chatbar input{flex:1;min-width:0;border:none;background:#262626;color:#fff;border-radius:20px;padding:10px 14px;outline:none;font-size:14px}
.sendbtn{border:none;background:linear-gradient(135deg,#00AEEC,#FB7299);color:#fff;border-radius:20px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <button class="back" onclick="location.href='index.html'">←</button>
    <span class="logoChip"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>BLABLA</span>
    <span class="live">● LIVE</span>
    <span class="viewers">👁️ <span id="viewers">1,247</span></span>
    <button class="addb" onclick="openCreate()">＋</button>

  <div class="tabrow">
    <button class="tabb on" id="tabReels" onclick="setView('reels')">🎬 ريلز</button>

  <div class="stage">
    <div class="reels" id="reels"></div>
    <div class="chatmsgs" id="localChat"></div>

        <div class="gpHead">🎁 أرسل هدية<span class="gpWallet">💰 <span id="gpCoins">100</span> <button onclick="recharge()">➕</button></span><button class="gpx" onclick="closeGiftPanel()">✕</button></div>

</div>

  <video id="recVideo" autoplay playsinline muted></video>

    <button class="snapbtn" id="recBtn" onclick="recToggle()"></button>
  </div>

    <input id="recCap" placeholder="الوصف + #هاشتاغ مثلا: #maroc #nova">
    <div style="display:flex;gap:10px">
      <button class="camb" style="flex:0 0 64px" onclick="resetRec()">↩</button>
      <button class="sendbtn" style="flex:1;padding:14px;font-size:15px" onclick="saveReel()">💾 حفظ الريل</button>
    </div>
  </div>
</div>
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('nova_session')||'null');if(!s||!s.email){window.location.replace('login.html');}}catch(e){window.location.replace('login.html');}})();
</script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ===== BLABLA — تطبيق مستقل (ريلز + لايف حقيقي + شات + هدايا + موسيقى + فيديو + هاشتاغ) =====
var LIVE_ID='nova-blabla-live-cb212';
var livePeer=null,liveStream=null,liveMode=null;
var liveConns=[],liveCall=null,liveData=null,liveTimer=null;
var curView='reels';
var REEL_DEMO=[
 {n:7,img:'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80',likes:385,av:12,s:0,cap:'طلع الجبل 🏔️ #maroc #nature'},
 {n:12,img:'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800&q=80',likes:254,av:33,s:1,cap:'الليل فالصحراء ✨ #sahara #maroc'},
 {n:15,img:'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&q=80',likes:198,av:52,s:2,cap:'هدوء الغابة 🌲 #nature #green'},
 {n:21,img:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80',likes:512,av:15,s:3,cap:'شجرة عمرها مية عام 🌳 #green #nature'},
 {n:33,img:'https://images.unsplash.com/photo-1501594907352-04c20138560a?w=800&q=80',likes:167,av:8,s:4,cap:'السفر عالم 🌍 #travel #maroc'}
];
var REPLIES=['Haha 😂','Wow 🔥','NOVA 🚀','From Morocco 🇲🇦','Nice! 👏','😂😂😂','Cool 😎'];

function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function myName(){try{var s=JSON.parse(localStorage.getItem('nova_session')||'null');if(s&&s.name)return s.name;}catch(e){}return 'Guest';}
function getUserReels(){try{return JSON.parse(localStorage.getItem('novaReels')||'[]')}catch(e){return []}}
function getLikes(){try{return JSON.parse(localStorage.getItem('novaLikes')||'{}')}catch(e){return {}}}
function getGifts(){try{return JSON.parse(localStorage.getItem('novaGifts')||'{}')}catch(e){return {}}}
function setView(v){
  curView=v;
  document.getElementById('tabReels').classList.toggle('on',v==='reels');
  document.getElementById('tabLive').classList.toggle('on',v==='live');
  document.getElementById('liveStage').classList.toggle('on',v==='live');
  document.getElementById('localChat').style.display=(v==='reels')?'flex':'none';
  if(v==='reels'){renderReels();}
}
// ---------- الهاشتاغ ----------
function allReels(){return getUserReels().concat(REEL_DEMO);}
function tagify(x){var s=esc(x);return s.replace(/#([\u0600-\u06FFa-zA-Z0-9_]+)/g,'<span class="tag" onclick="openTag(\'$1\')">#$1</span>');}
function getTagMap(){var m={};allReels().forEach(function(r){String(r.cap||'').replace(/#([\u0600-\u06FFa-zA-Z0-9_]+)/g,function(w,t){m[t]=(m[t]||0)+1;});});return m;}
function openTags(){
  var m=getTagMap();
  var arr=Object.keys(m).sort(function(a,b){return m[b]-m[a];});
  var h='';
  arr.forEach(function(t){h+='<div class="srow" style="cursor:pointer" onclick="openTag(\''+t+'\')"><span style="font-size:24px;font-weight:900;color:#00AEEC">#</span><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14px">#'+esc(t)+'</div><div style="font-size:12px;color:#aaa">'+m[t]+' فيديو</div></div><span style="color:#666">→</span></div>';});
  if(!arr.length)h='<div style="color:#888;text-align:center;padding:20px">مازال ماكاينش هاشتاغ</div>';
  document.getElementById('tagTitle').textContent='# الهاشتاغ';
  document.getElementById('tagBody').innerHTML=h;
  document.getElementById('tagPanel').classList.add('on');
}
function openTag(t){
  var h='';
  allReels().forEach(function(r,i){
    var tags=String(r.cap||'').match(/#([\u0600-\u06FFa-zA-Z0-9_]+)/g)||[];
    var hit=tags.some(function(x){return x==='#'+t;});
    if(hit){
      var author=r.you?myName():('Explorer '+r.n);
      var th=r.vid?'🎥':'<img src="'+r.img+'" width="54" height="54" style="object-fit:cover;border-radius:8px">';
      h+='<div class="srow" style="cursor:pointer" onclick="scrollReel('+i+')"><span style="width:54px;height:54px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#111;border-radius:8px">'+th+'</span><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:13px">@'+esc(author)+'</div><div style="font-size:12px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.cap||'')+'</div></div><span style="color:#666">→</span></div>';
    }
  });
  document.getElementById('tagTitle').textContent='#'+t;
  document.getElementById('tagBody').innerHTML=h||'<div style="color:#888;text-align:center;padding:20px">ماكاينش فيديو بهاد الهاشتاغ</div>';
  document.getElementById('tagPanel').classList.add('on');
}
function scrollReel(i){closeTags();var el=document.getElementById('reels').children[i];if(el)el.scrollIntoView({behavior:'smooth'});}
function closeTags(){document.getElementById('tagPanel').classList.remove('on');}
// ---------- ريلز ----------
function renderReels(){
  var rc=document.getElementById('reels');
  var keep=rc.scrollTop;
  var userReels=getUserReels();
  var LIKED=getLikes();
  var GIFTS=getGifts();
  var ALL=userReels.concat(REEL_DEMO);
  var tags=Object.keys(getTagMap()).length;
  var html='';
  ALL.forEach(function(r,i){
    var key=r.you?('u'+r.id):('d'+r.n);
    var liked=!!LIKED[key];
    var author=r.you?myName():('Explorer '+r.n);
    var likes=(r.you?0:r.likes)+(liked?1:0);
    var gifts=GIFTS[key]||0;
    var av=r.you?12:r.av;
    var si=(typeof r.s==='number'&&SONGS[r.s])?r.s:0;
    var sg=SONGS[si];
    var media=r.vid
      ?'<video class="bgvid" src="'+r.vid+'" autoplay muted loop playsinline onclick="this.muted=!this.muted"></video>'
      :'<img class="bgimg" src="'+r.img+'" alt="" loading="lazy">';
    html+='<div class="reel">'+media
    +'<div class="wm">🎵 BLABLA</div>'
    +'<div class="shade"></div>'
    +'<div class="rail"><button class="rb" onclick="likeReel('+i+',this)">'+(liked?'❤️':'🤍')+'<div class="cnt">'+likes.toLocaleString('en-US')+'</div></button>'
    +'<button class="rb" onclick="giftReel(\''+key+'\',this)">🎁<div class="cnt">'+gifts+'</div></button>'
    +'<button class="rb" onclick="shareReel('+i+')">↗️<div class="cnt">'+(r.you?0:Math.round((r.likes||100)/3))+'</div></button>'
    +'<button class="rb" onclick="openMusic()">🎵<div class="cnt">♫</div></button>'
    +'<button class="rb" onclick="openTags()">#<div class="cnt">'+tags+'</div></button></div>'
    +'<div class="caption"><img src="https://i.pravatar.cc/100?img='+av+'" width="32" height="32" alt="" style="border-radius:50%;vertical-align:-10px;margin-right:6px;border:2px solid #fff"><b>@'+esc(author)+'</b>'
    +'<div style="font-size:13px;margin-top:6px">'+(r.cap?tagify(r.cap):(r.you?'مقطع ديالي · NOVA 🚀':'NOVA vibes · From Morocco 🇲🇦'))+'</div>'
    +'<div style="font-size:12px;opacity:.95;margin-top:8px"><span class="disc">🎵</span> '+esc(sg.t)+' — '+esc(sg.a)+' · '+sg.p+' plays</div></div></div>';
  });
  rc.innerHTML=html;
  rc.scrollTop=keep;
}
function likeReel(i,btn){
  var ALL=allReels();
  var r=ALL[i];if(!r)return;

    document.getElementById('recTime').textContent='0:'+String(recSecs).padStart(2,'0');
    if(recSecs>=15)recStop();
  },1000);
}
function recStop(){
  if(recTimerI){clearInterval(recTimerI);recTimerI=null;}
  document.getElementById('recBtn').classList.remove('recording');
  if(recRec&&recRec.state==='recording'){try{recRec.stop();}catch(e){}}
}
function resetRec(){
  var v=document.getElementById('recVideo');
  v.srcObject=recStream;v.removeAttribute('src');v.muted=true;
  if(recStream)v.play();
  recResetUI();
}
function saveReel(){
  if(!recBlob){alert('سجل فيديو الأول 🎥');return;}
  var rd=new FileReader();
  rd.onload=function(){
    var cap=document.getElementById('recCap').value.trim();
    var reels=getUserReels();
    reels.unshift({id:Date.now(),vid:rd.result,you:true,s:(MA.song>=0?MA.song:0),cap:(cap||'مقطع ديالي 🎥 #nova')});
    var ok=false;
    while(!ok){
      try{localStorage.setItem('novaReels',JSON.stringify(reels));ok=true;}
      catch(e){
        var idx=-1;
        for(var j=reels.length-1;j>=0;j--){if(reels[j]&&reels[j].vid){idx=j;break;}}
        if(idx<0)break;
        reels.splice(idx,1);
      }
    }
    if(ok){alert('تسجل! غادي يبان فالريلز 🎥');closeCreate();}
    else{alert('الميموار عامرة — حيد شي فيديو قديم وعاود');}
  };
  rd.readAsDataURL(recBlob);
}
function closeCreate(){
  recClosing=true;
  recStop();
  recClosing=false;
  if(recTimerI){clearInterval(recTimerI);recTimerI=null;}
  if(recStream){recStream.getTracks().forEach(function(t){t.stop();});recStream=null;}
  var v=document.getElementById('recVideo');v.srcObject=null;v.removeAttribute('src');v.load();
  document.getElementById('createUI').classList.remove('on');
  renderReels();
}
// ---------- اللايف الحقيقي ----------
function setViewers(n){
  var v=document.getElementById('viewers');if(v)v.textContent=n;
  if(liveMode==='host'){liveConns.forEach(function(c){try{c.send({type:'viewers',n:n});}catch(e){}});}
}
function liveUIReset(){
  document.getElementById('hostCtrls').style.display='none';
  document.getElementById('closeBtn').style.display='none';
  document.getElementById('startUI').style.display='flex';
  document.getElementById('liveVideo').srcObject=null;
  document.getElementById('liveChat').innerHTML='';
  document.getElementById('who').style.display='none';
  document.getElementById('who').textContent='';
  document.getElementById('muteBtn').style.display='none';
  document.getElementById('muteBtn').textContent='🔊';
  document.getElementById('giftBtn').style.display='none';
  closeGiftPanel();
  document.getElementById('viewers').textContent='1,247';
}
function muteToggle(b){var v=document.getElementById('liveVideo');v.muted=!v.muted;b.textContent=v.muted?'🔇':'🔊';}
function goLive(){
  if(liveMode)return;
  if(typeof Peer==='undefined'){alert('Live SDK ماخدمش');return;}
  setView('live');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(function(stream){
    liveStream=stream;liveMode='host';
    var v=document.getElementById('liveVideo');
    v.srcObject=stream;v.muted=true;
    document.getElementById('startUI').style.display='none';
    document.getElementById('hostCtrls').style.display='flex';
    document.getElementById('closeBtn').style.display='none';
    document.getElementById('giftBtn').style.display='none';
    closeGiftPanel();
    document.getElementById('who').style.display='block';
    updateHostWho();
    document.getElementById('muteBtn').style.display='block';
    document.getElementById('muteBtn').textContent='🔇';
    chatAdd('liveChat','NOVA','LIVE 🚀');
    livePeer=new Peer(LIVE_ID,{debug:0});
    livePeer.on('open',function(){setViewers(0);});
    livePeer.on('error',function(e){
      if(e.type==='unavailable-id'){
        alert('اللايف راه خدام فجلسة أخرى — استنى شي دقيقة وعاود');
        stopLive();
      }else{alert('مشكل فاللايف: '+e.type);}
    });
    livePeer.on('connection',function(conn){
      liveConns.push(conn);setViewers(liveConns.length);
      conn.on('open',function(){try{conn.send({type:'name',name:myName()});}catch(e){}});
      conn.on('data',function(d){
        if(d&&d.type==='chat'){
          chatAdd('liveChat',d.name,d.text);
          liveConns.forEach(function(c2){if(c2!==conn){try{c2.send({type:'chat',name:d.name,text:d.text});}catch(e2){}}});
        }else if(d&&d.type==='gift'){hostGotGift(d,conn);}
      });
      conn.on('close',function(){liveConns=liveConns.filter(function(c){return c!==conn;});setViewers(liveConns.length);});
    });
    livePeer.on('call',function(call){call.answer(liveStream);});
  }).catch(function(){alert('مقدرناش حلينا الكاميرا');});
}
function flipLive(){var v=document.getElementById('liveVideo');v.style.transform=(v.style.transform==='scaleX(-1)')?'':'scaleX(-1)';}
function snapLive(){
  if(liveMode!=='host')return;
  var v=document.getElementById('liveVideo');
  var c=document.createElement('canvas');
  c.width=v.videoWidth||720;c.height=v.videoHeight||1280;
  var ctx=c.getContext('2d');
  if(v.style.transform==='scaleX(-1)'){ctx.translate(c.width,0);ctx.scale(-1,1);}
  ctx.drawImage(v,0,0,c.width,c.height);
  var img=c.toDataURL('image/jpeg',.75);
  var userReels=getUserReels();
  userReels.unshift({id:Date.now(),img:img,you:true,s:(MA.song>=0?MA.song:0)});
  try{localStorage.setItem('novaReels',JSON.stringify(userReels))}catch(e){}
  alert('تصويرت! غادي تبان فالريلز 📸');
}
function stopLive(){
  if(liveMode!=='host')return;
  liveConns.forEach(function(c){try{c.send({type:'end'});}catch(e){}});
  try{livePeer.destroy();}catch(e){}
  livePeer=null;liveConns=[];
  if(liveStream){liveStream.getTracks().forEach(function(t){t.stop();});liveStream=null;}
  liveMode=null;liveUIReset();
}
function watchLive(){
  if(liveMode)return;
  if(typeof Peer==='undefined'){alert('Live SDK ماخدمش');return;}
  setView('live');
  liveMode='viewer';
  document.getElementById('startUI').style.display='none';
  document.getElementById('hostCtrls').style.display='none';
  document.getElementById('closeBtn').style.display='block';
  document.getElementById('giftBtn').style.display='block';
  document.getElementById('who').style.display='block';
  document.getElementById('who').textContent='...connecting';
  document.getElementById('muteBtn').style.display='block';
  closeGiftPanel();
  var silent=null;
  try{silent=new AudioContext().createMediaStreamDestination().stream;}catch(e){}
  livePeer=new Peer({debug:0});
  var got=false;
  livePeer.on('open',function(){
    liveCall=livePeer.call(LIVE_ID,silent);
    liveData=livePeer.connect(LIVE_ID);
    liveData.on('data',function(d){
      if(d&&d.type==='chat'){chatAdd('liveChat',d.name,d.text);}
      else if(d&&d.type==='viewers'){setViewers(d.n);}
      else if(d&&d.type==='name'){document.getElementById('who').textContent=d.name+' 🚀';}
      else if(d&&d.type==='gift'){showGift(d.name,d.emoji,d.cost);}
      else if(d&&d.type==='end'){endWatch();alert('اللايف تسالا');}
    });
    liveData.on('close',function(){endWatch();});
    if(liveCall){
      liveCall.on('stream',function(remote){
        got=true;clearTimeout(liveTimer);
        var v=document.getElementById('liveVideo');v.srcObject=remote;
      });
      liveCall.on('close',function(){endWatch();});
    }
  });
  livePeer.on('error',function(e){
    if(e.type==='peer-unavailable'){endWatch();alert('ماكاين لايف دابا');}
  });
  liveTimer=setTimeout(function(){if(!got){endWatch();alert('ماكاين لايف دابا');}},10000);
}
function endWatch(){
  if(liveMode!=='viewer')return;
  clearTimeout(liveTimer);
  try{if(liveCall)liveCall.close();}catch(e){}
  try{if(liveData)liveData.close();}catch(e){}
  try{livePeer.destroy();}catch(e){}
  liveCall=null;liveData=null;livePeer=null;liveMode=null;
  liveUIReset();
}
// ---------- الإرسال ----------
function sendChat(){
  var inp=document.getElementById('chatInput');
  var txt=inp.value.trim();if(!txt)return;inp.value='';
  if(curView==='live'&&liveMode==='host'){
    chatAdd('liveChat',myName(),txt);
    liveConns.forEach(function(c){try{c.send({type:'chat',name:myName(),text:txt});}catch(e){}});
  }else if(curView==='live'&&liveMode==='viewer'){
    chatAdd('liveChat','You',txt);
    try{liveData.send({type:'chat',name:myName(),text:txt});}catch(e){}
  }else{
    localChat(txt);
  }
}
renderReels();
</script>
