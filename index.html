<!-- NOVA Google Sign-In -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
(function () {
  const firebaseConfig = {
    apiKey: "AIzaSyAP1KiAtoMB5EkGWopUuKm0LQMNi1QkApM",
    authDomain: "nova-cb212.firebaseapp.com",
    projectId: "nova-cb212",
    storageBucket: "nova-cb212.firebasestorage.app",
    messagingSenderId: "660417453842",
    appId: "1:660417453842:web:047ccaa48dc441d5f6ddcb",
    measurementId: "G-78X5WCEJWW"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const auth = firebase.auth();

  const btn = document.createElement("button");
  btn.id = "nova-google-login";
  btn.type = "button";
  btn.style.cssText =
    "position:fixed;bottom:78px;right:12px;z-index:9999;" +
    "background:#1877f2;color:#fff;border:none;border-radius:50%;" +
    "width:52px;height:52px;font-size:22px;" +
    "box-shadow:0 4px 12px rgba(0,0,0,.35);overflow:hidden;cursor:pointer;";
  btn.textContent = "👤";
  btn.title = "Sign in with Google";
  document.body.appendChild(btn);

  auth.onAuthStateChanged(function (user) {
    if (user) {
      if (user.photoURL) {
        const img = document.createElement("img");
        img.src = user.photoURL;
        img.alt = "Profile";
        img.style.cssText =
          "width:52px;height:52px;border-radius:50%;object-fit:cover;";
        btn.replaceChildren(img);
      } else {
        btn.textContent = "👤";
      }
      btn.title = user.displayName || user.email || "NOVA";
    } else {
      btn.textContent = "👤";
      btn.title = "Sign in with Google";
    }
  });

  btn.addEventListener("click", function () {
    const user = auth.currentUser;

    if (user) {
      if (confirm((user.displayName || user.email || "NOVA") + " - Sign out?")) {
        auth.signOut().catch(function (err) {
          alert("Sign-out error: " + (err.code || err.message));
        });
      }
      return;
    }

    btn.textContent = "⏳";
    const provider = new firebase.auth.GoogleAuthProvider();

    auth.signInWithRedirect(provider).catch(function (err) {
      btn.textContent = "👤";
      alert("Sign-in error: " + (err.code || err.message));
    });
  });

  auth.getRedirectResult().catch(function (err) {
    console.error("NOVA sign-in:", err);
  });
})();
</script>

</body>
</html>
