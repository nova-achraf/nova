.caption{position:absolute;left:12px;right:70px;bottom:16px;color:#fff}

.msg{background:rgba(0,0,0,.5);color:#fff;padding:6px 11px;border-radius:16px;font-size:13px;width:fit-content}

.chatbar input{flex:1;border:none;background:#262626;color:#fff;border-radius:20px;padding:10px 14px;outline:none}
.sendbtn{border:none;background:#1877f2;color:#fff;border-radius:20px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer}
