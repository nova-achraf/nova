<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA - Achraf Aza</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f0f2f5}
.header{position:sticky;top:0;z-index:100;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.logo{width:42px;height:42px;background:#1877f2;color:#fff;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:22px}
.cover{width:100%;height:240px;overflow:hidden;background:#ddd}.cover img{width:100%;height:100%;object-fit:cover}
.profile{background:#fff;padding:12px 14px}
.top{display:flex;gap:12px;align-items:flex-start}
.avatar{width:86px;height:86px;border-radius:50%;border:4px solid #fff;margin-top:-32px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.info h1{font-size:22px;font-weight:800}
.card{background:#fff;border-radius:12px;padding:12px;margin:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.composer{display:flex;gap:10px;align-items:center}
.composer img{width:38px;height:38px;border-radius:50%}
.composer input{flex:1;border:none;background:#f0f2f5;border-radius:20px;padding:11px 14px;outline:none}
.opts{display:flex;justify-content:space-around;border-top:1px solid #eee;padding-top:10px;margin-top:10px}
.opt{font-weight:600;font-size:14px;cursor:pointer}
.media-wrap{position:relative;margin-top:10px;border-radius:10px;overflow:hidden;background:#000}
.media-wrap img,.media-wrap video{width:100%;display:block;max-height:450px;object-fit:contain}
.dl{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.75);color:#fff;border:none;border-radius:20px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;z-index:2}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:7px 0;z-index:100}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:#65676b;text-decoration:none}.nav.active{color:#1877f2;font-weight:700}.nav span{font-size:20px}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column}
#viewer.active{display:flex}
#viewer img,#viewer video{max-width:95%;max-height:85%;border-radius:8px}
</style>
</head>
<body>

<div class="header"><div class="logo">N</div><div>🌐 English</div></div>
