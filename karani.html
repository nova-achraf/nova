<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1410">
<title>كرني — ديون الحانوت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1410; --bg2:#0F1B15; --card:#121F19; --card2:#16261E; --line:#20362A;
  --green:#34D399; --green2:#1F7A4D; --gold:#E8C97A; --txt:#EDF2EE; --dim:#8AA095;
  --red:#F87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:'Cairo',system-ui,sans-serif;overscroll-behavior-y:contain}
body{padding-bottom:90px}
button{font-family:inherit}

/* header */
header{
  position:sticky;top:0;z-index:30;padding:14px 16px 12px;
  background:linear-gradient(180deg,rgba(11,20,16,.98),rgba(11,20,16,.86));
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px}
.brand .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#1C3A2B,#0F231A);border:1px solid #2A4B39;font-size:17px}
.brand h1{margin:0;font-size:15px;font-weight:800}
.brand .sub{font-size:9.5px;color:var(--dim);margin-top:1px}
.menu{margin-right:auto;display:flex;gap:6px}
.mbtn{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:9px;
  width:32px;height:32px;font-size:13px;cursor:pointer}
.mbtn:active{transform:scale(.94)}

/* total card */
.total{
  margin:12px 16px 0;padding:16px;border-radius:18px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#16382A,#0F231A 70%);border:1px solid #26523C;
}
.total::after{content:"";position:absolute;inset:auto -40px -60px auto;width:160px;height:160px;
  border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,.16),transparent 70%)}
.total .lbl{font-size:10.5px;color:#9CC2AF;letter-spacing:.3px}
.total .amt{font-size:30px;font-weight:800;color:var(--green);margin-top:4px;line-height:1.1}
.total .amt small{font-size:14px;font-weight:600;color:#7FB79C;margin-right:3px}
.total .row{display:flex;gap:14px;margin-top:10px;font-size:10px;color:#9CC2AF}
.total .row b{color:var(--txt);font-weight:700}

/* search */
.search{margin:12px 16px 0;position:relative}
.search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 36px 10px 12px;color:var(--txt);font-size:13px;outline:none;font-family:inherit}
.search input::placeholder{color:#5D7568}
.search i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;opacity:.5;font-size:13px}

/* customer list */
.list{padding:12px 16px 0}
.cust{
  display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:.15s;
}
.cust:active{transform:scale(.985);border-color:#2E5643}
.av{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;background:#1B2E24;color:var(--gold);border:1px solid #2A4535}
.cinfo{flex:1;min-width:0}
.cname{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:9.5px;color:var(--dim);margin-top:2px}
.cbal{font-size:13px;font-weight:800;white-space:nowrap}
.cbal.zero{color:var(--dim);font-size:12px}
.cbal.due{color:var(--red)}

.empty{text-align:center;padding:44px 20px;color:var(--dim)}
.empty .e{font-size:38px;margin-bottom:8px;opacity:.55}
.empty .t{font-size:12.5px;font-weight:600;color:#B9C9C0}
.empty .s{font-size:10.5px;margin-top:5px;line-height:1.6}

/* fab */
.fab{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;
  background:linear-gradient(145deg,#34D399,#1F9E6E);color:#07231A;border:0;
  border-radius:16px;padding:13px 22px;font-size:13px;font-weight:800;cursor:pointer;
  box-shadow:0 10px 26px rgba(31,158,110,.38);display:flex;align-items:center;gap:7px;
}
.fab:active{transform:translateX(-50%) scale(.96)}

/* detail */
#detail{display:none}
.dtop{display:flex;align-items:center;gap:9px;padding:14px 16px 6px}
.bback{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  color:var(--txt);font-size:15px;cursor:pointer}
.dtop .nm{font-size:15px;font-weight:800}
.dtop .ph{font-size:10px;color:var(--dim);margin-top:1px}

.hero{margin:6px 16px 0;padding:16px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(160deg,var(--card2),var(--card));text-align:center}
.hero .l{font-size:10px;color:var(--dim)}
.hero .v{font-size:28px;font-weight:800;margin-top:3px}
.hero .v.g{color:var(--green)}
.hero .v.r{color:var(--red)}

.acts{display:flex;gap:8px;padding:12px 16px 0}
.act{flex:1;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);
  padding:11px 6px;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px}
.act span{font-size:15px}
.act.primary{background:rgba(52,211,153,.14);border-color:#2A6B4E;color:var(--green)}
.act.wa{background:rgba(37,211,102,.12);border-color:#255E3B;color:#4ADE80}
.act:active{transform:scale(.97)}

.sect{padding:18px 16px 6px;font-size:11px;color:var(--dim);font-weight:600}

.entry{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;margin:0 16px 8px}
.entry .ei{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0}
.entry .ei.c{background:rgba(248,113,113,.14);color:var(--red)}
.entry .ei.p{background:rgba(52,211,153,.14);color:var(--green)}
.entry .em{flex:1;min-width:0}
.entry .en{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .ed{font-size:9px;color:var(--dim);margin-top:1px}
.entry .ea{font-size:12px;font-weight:800;white-space:nowrap}
.entry .ea.c{color:var(--red)}
.entry .ea.p{color:var(--green)}
.entry .del{background:transparent;border:0;color:#4A5E54;font-size:13px;cursor:pointer;padding:4px}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(4,10,7,.78);backdrop-filter:blur(5px);
  display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;
  max-width:520px;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 12px;font-size:14px}
.field{margin-bottom:10px}
.field label{display:block;font-size:10.5px;color:var(--dim);margin-bottom:5px}
.field input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;color:var(--txt);font-size:14px;outline:none;font-family:inherit}
.field input:focus{border-color:#2E7A57}
.field input[type=number]{font-weight:700;font-size:17px;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:9px;
  padding:6px 11px;font-size:11px;cursor:pointer;font-weight:600}
.chip:active{background:var(--card2)}
.sbtns{display:flex;gap:8px;margin-top:14px}
.sbtn{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--txt);font-size:13px;font-weight:700;cursor:pointer}
.sbtn.go{background:linear-gradient(145deg,#34D399,#1F9E6E);border:0;color:#07231A}
.sbtn.go.red{background:linear-gradient(145deg,#F87171,#C2453F);color:#2A0808}

.toast{position:fixed;bottom:86px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.25s;
  background:#1C3A2B;border:1px solid #2C5C43;color:#D5F5E5;border-radius:11px;padding:9px 15px;
  font-size:11.5px;z-index:80;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="ic">🧾</div>
    <div>
      <h1>كرني</h1>
      <div class="sub">ديون الحانوت · بلا ورق</div>
    </div>
    <div class="menu">
      <button class="mbtn" id="exportBtn" title="خد نسخة">⤓</button>
      <button class="mbtn" id="importBtn" title="رجع نسخة">⤒</button>
    </div>
  </div>
</header>

<div id="home">
  <div class="total">
    <div class="lbl">عندك عند الناس دابا</div>
    <div class="amt"><span id="totDue">0</span> <small>درهم</small></div>
    <div class="row">
      <div>عدد الزبناء <b id="totCust">0</b></div>
      <div>متأخرين <b id="totLate">0</b></div>
      <div>خلصو هاد الشهر <b id="totPaid">0</b></div>
    </div>
  </div>

  <div class="search">
    <input id="q" type="search" placeholder="قلّب على زبون…" autocomplete="off">
    <i>🔍</i>
  </div>

  <div class="list" id="list"></div>
</div>

<div id="detail">
  <div class="dtop">
    <button class="bback" id="backBtn">→</button>
    <div>
      <div class="nm" id="dName">—</div>
      <div class="ph" id="dPhone">—</div>
    </div>
  </div>

  <div class="hero">
    <div class="l" id="dLabel">باقي عليه</div>
    <div class="v r" id="dBal">0 درهم</div>
  </div>

  <div class="acts">
    <button class="act primary" id="addCredit"><span>➕</span>كريدي</button>
    <button class="act" id="addPay"><span>💵</span>خلص</button>
    <button class="act wa" id="waBtn"><span>📲</span>واتساب</button>
  </div>

  <div class="sect">السجل</div>
  <div id="entries"></div>
</div>

<button class="fab" id="fab"><span>＋</span> زبون جديد</button>

<!-- modal: customer -->
<div class="modal" id="mCust">
  <div class="sheet">
    <h3>زبون جديد</h3>
    <div class="field">
      <label>الاسم</label>
      <input id="cName" type="text" placeholder="سي محمد" autocomplete="off">
    </div>
    <div class="field">
      <label>الهاتف (اختياري)</label>
      <input id="cPhone" type="tel" placeholder="06 12 34 56 78" autocomplete="off">
    </div>
    <div class="sbtns">
      <button class="sbtn" data-close>سد</button>
      <button class="sbtn go" id="saveCust">زيد</button>
    </div>
  </div>
</div>

<!-- modal: entry -->
<div class="modal" id="mEntry">
  <div class="sheet">
    <h3 id="eTitle">كريدي جديد</h3>
    <div class="field">
      <label>المبلغ (درهم)</label>
      <input id="eAmt" type="number" inputmode="decimal" placeholder="0" min="0" step="0.5">
      <div class="chips" id="chips">
        <button class="chip" data-v="10">10</button>
        <button class="chip" data-v="20">20</button>
        <button class="chip" data-v="50">50</button>
        <button class="chip" data-v="100">100</button>
        <button class="chip" data-v="200">200</button>
      </div>
    </div>
    <div class="field">
      <label>شنو خدا (اختياري)</label>
      <input id="eNote" type="text" placeholder="زيت + سكر" autocomplete="off">
    </div>
    <div class="sbtns">
      <button class="sbtn" data-close>سد</button>
      <button class="sbtn go" id="saveEntry">سجل</button>
    </div>
  </div>
</div>

<input type="file" id="fileIn" accept="application/json" style="display:none">
<div class="toast" id="toast"></div>

<script>
/* ================= البيانات ================= */
var KEY = 'karani_v1';
var db = { customers: [] };

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && Array.isArray(p.customers)) db = p;
    }
  } catch(e){}
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){ toast('ما قدرناش نخزنو'); }
}

function today(){ return new Date().toISOString().slice(0,10); }
function fmt(n){
  n = Math.round(n * 100) / 100;
  return n.toLocaleString('fr-MA').replace(/\u202f/g,' ');
}
function balance(c){
  var b = 0;
  for (var i=0;i<c.entries.length;i++){
    var e = c.entries[i];
    b += (e.type === 'credit' ? e.amount : -e.amount);
  }
  return Math.round(b * 100) / 100;
}
function initials(name){
  var p = name.trim().split(/\s+/);
  return (p[0]||'؟').charAt(0);
}

/* ================= الواجهة ================= */
var el = {
  home: document.getElementById('home'),
  detail: document.getElementById('detail'),
  list: document.getElementById('list'),
  q: document.getElementById('q'),
  fab: document.getElementById('fab'),
  totDue: document.getElementById('totDue'),
  totCust: document.getElementById('totCust'),
  totLate: document.getElementById('totLate'),
  totPaid: document.getElementById('totPaid'),
  dName: document.getElementById('dName'),
  dPhone: document.getElementById('dPhone'),
  dBal: document.getElementById('dBal'),
  dLabel: document.getElementById('dLabel'),
  entries: document.getElementById('entries'),
  mCust: document.getElementById('mCust'),
  mEntry: document.getElementById('mEntry'),
  eTitle: document.getElementById('eTitle'),
  eAmt: document.getElementById('eAmt'),
  eNote: document.getElementById('eNote'),
  cName: document.getElementById('cName'),
  cPhone: document.getElementById('cPhone'),
  toast: document.getElementById('toast')
};

var view = { custId: null, entryType: 'credit' };

function toast(msg){
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.toast.classList.remove('show'); }, 1900);
}

function renderHome(){
  var total = 0, late = 0, paidMonth = 0;
  var nowM = today().slice(0,7);
  db.customers.forEach(function(c){
    var b = balance(c);
    if (b > 0) total += b;
    var last = c.entries.length ? c.entries[c.entries.length-1].date : '';
    if (b > 0 && last && last < today()) late++;
    c.entries.forEach(function(e){
      if (e.type === 'pay' && e.date.slice(0,7) === nowM) paidMonth += e.amount;
    });
  });

  el.totDue.textContent = fmt(total);
  el.totCust.textContent = db.customers.filter(function(c){ return balance(c) > 0; }).length;
  el.totLate.textContent = late;
  el.totPaid.textContent = fmt(paidMonth);

  var f = (el.q.value || '').trim();
  var rows = db.customers.slice().sort(function(a,b){ return balance(b) - balance(a); })
    .filter(function(c){
      if (!f) return true;
      return c.name.indexOf(f) > -1 || (c.phone||'').indexOf(f) > -1;
    });

  if (!db.customers.length){
    el.list.innerHTML = '<div class="empty"><div class="e">🧾</div>' +
      '<div class="t">مازال ما زدتي حتى زبون</div>' +
      '<div class="s">دوس على «زبون جديد» وبدا سجل الكريدي ديالك</div></div>';
    return;
  }
  if (!rows.length){
    el.list.innerHTML = '<div class="empty"><div class="e">🔍</div><div class="t">ما لقيناش شي زبون</div></div>';
    return;
  }

  el.list.innerHTML = rows.map(function(c){
    var b = balance(c);
    var cls = b > 0 ? 'due' : 'zero';
    var txt = b > 0 ? fmt(b) + ' د' : 'خلص ✓';
    var n = c.entries.length;
    return '<div class="cust" data-id="'+c.id+'">' +
      '<div class="av">'+initials(c.name)+'</div>' +
      '<div class="cinfo"><div class="cname">'+esc(c.name)+'</div>' +
      '<div class="cmeta">'+n+' حركة'+(c.phone?' · '+esc(c.phone):'')+'</div></div>' +
      '<div class="cbal '+cls+'">'+txt+'</div></div>';
  }).join('');

  Array.prototype.forEach.call(el.list.querySelectorAll('.cust'), function(n){
    n.onclick = function(){ openCust(this.getAttribute('data-id')); };
  });
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

function openCust(id){
  view.custId = id;
  el.home.style.display = 'none';
  el.detail.style.display = 'block';
  el.fab.style.display = 'none';
  renderDetail();
  window.scrollTo(0,0);
}

function renderDetail(){
  var c = db.customers.find(function(x){ return x.id === view.custId; });
  if (!c) return back();

  el.dName.textContent = c.name;
  el.dPhone.textContent = c.phone || 'بلا نمرة';

  var b = balance(c);
  el.dBal.textContent = fmt(Math.abs(b)) + ' درهم';
  el.dBal.className = 'v ' + (b > 0 ? 'r' : 'g');
  el.dLabel.textContent = b > 0 ? 'باقي عليه' : 'خلص كلشي ✓';

  var sorted = c.entries.slice().sort(function(a,b2){ return a.ts < b2.ts ? 1 : -1; });
  if (!sorted.length){
    el.entries.innerHTML = '<div class="empty" style="padding:26px 20px"><div class="s">' +
      'مازال ما سجلتي حتى حركة لهاد الزبون</div></div>';
    return;
  }
  el.entries.innerHTML = sorted.map(function(e){
    var isC = e.type === 'credit';
    return '<div class="entry">' +
      '<div class="ei '+(isC?'c':'p')+'">'+(isC?'↑':'↓')+'</div>' +
      '<div class="em"><div class="en">'+esc(e.note || (isC?'كريدي':'خلاص'))+'</div>' +
      '<div class="ed">'+e.date+'</div></div>' +
      '<div class="ea '+(isC?'c':'p')+'">'+(isC?'+':'−')+fmt(e.amount)+'</div>' +
      '<button class="del" data-del="'+e.id+'">✕</button></div>';
  }).join('');

  Array.prototype.forEach.call(el.entries.querySelectorAll('[data-del]'), function(btn){
    btn.onclick = function(){
      var id = this.getAttribute('data-del');
      c.entries = c.entries.filter(function(e){ return e.id !== id; });
      save(); renderDetail(); toast('تحيدت');
    };
  });
}

function back(){
  el.detail.style.display = 'none';
  el.home.style.display = 'block';
  el.fab.style.display = 'flex';
  view.custId = null;
  renderHome();
  window.scrollTo(0,0);
}

/* ================= الأزرار ================= */
el.fab.onclick = function(){
  el.cName.value = ''; el.cPhone.value = '';
  el.mCust.classList.add('show');
  setTimeout(function(){ el.cName.focus(); }, 120);
};

document.getElementById('saveCust').onclick = function(){
  var name = el.cName.value.trim();
  if (!name) { toast('كتب الاسم'); return; }
  var c = { id: uid(), name: name, phone: el.cPhone.value.trim(), entries: [] };
  db.customers.push(c);
  save();
  el.mCust.classList.remove('show');
  renderHome();
  toast('تزاد ✓');
  openCust(c.id);
};

document.getElementById('backBtn').onclick = back;

document.getElementById('addCredit').onclick = function(){ openEntry('credit'); };
document.getElementById('addPay').onclick = function(){ openEntry('pay'); };

function openEntry(type){
  view.entryType = type;
  el.eTitle.textContent = type === 'credit' ? 'كريدي جديد' : 'خلاص';
  el.eAmt.value = '';
  el.eNote.value = '';
  el.mEntry.classList.add('show');
  setTimeout(function(){ el.eAmt.focus(); }, 120);
}

document.getElementById('chips').onclick = function(e){
  var v = e.target.getAttribute('data-v');
  if (v) el.eAmt.value = v;
};

document.getElementById('saveEntry').onclick = function(){
  var amt = parseFloat(el.eAmt.value);
  if (!amt || amt <= 0) { toast('كتب مبلغ صحيح'); return; }
  var c = db.customers.find(function(x){ return x.id === view.custId; });
  if (!c) return;
  c.entries.push({
    id: uid(),
    type: view.entryType,
    amount: Math.round(amt * 100) / 100,
    note: el.eNote.value.trim(),
    date: today(),
    ts: Date.now()
  });
  save();
  el.mEntry.classList.remove('show');
  renderDetail();
  toast(view.entryType === 'credit' ? 'تزاد الكريدي' : 'تسجل الخلاص');
};

document.getElementById('waBtn').onclick = function(){
  var c = db.customers.find(function(x){ return x.id === view.custId; });
  if (!c) return;
  var b = balance(c);
  var msg;
  if (b > 0) {
    msg = 'سي ' + c.name.split(' ')[0] + '، سلام 🙏\n' +
          'باقي عليك ' + fmt(b) + ' درهم.\n' +
          'إلا خلصتي، الله يخليك صيفط ليا. شكرا!';
  } else {
    msg = 'سي ' + c.name.split(' ')[0] + '، شكرا على الخلاص 🙏 الله يبارك';
  }
  var phone = (c.phone || '').replace(/\D/g,'');
  if (phone.charAt(0) === '0') phone = '212' + phone.slice(1);
  var url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);
  window.open(url, '_blank');
};

el.q.oninput = renderHome;

document.querySelectorAll('[data-close]').forEach(function(b){

});

/* ================= نسخ احتياطي ================= */
document.getElementById('exportBtn').onclick = function(){
  var data = JSON.stringify(db, null, 2);
  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'karani-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  toast('تحميلات النسخة');
};

document.getElementById('importBtn').onclick = function(){
  document.getElementById('fileIn').click();
};

document.getElementById('fileIn').onchange = function(e){
  var f = e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var p = JSON.parse(r.result);
      if (!p || !Array.isArray(p.customers)) throw new Error('bad');
      p.customers.forEach(function(c){
        if (!c.id) c.id = uid();
        if (!Array.isArray(c.entries)) c.entries = [];
      });
      db = p; save(); renderHome(); toast('ترجعات النسخة ✓');
    } catch(err){ toast('الملف ماشي صحيح'); }
  };
  r.readAsText(f);
  e.target.value = '';
};
